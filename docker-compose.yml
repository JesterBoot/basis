services:
  db:
    image: postgres:16-alpine
    container_name: basis-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-basis}
      POSTGRES_USER: ${POSTGRES_USER:-basis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-basis}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: basis-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-basis}
      POSTGRES_USER: ${POSTGRES_USER:-basis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-basis}
      API_HOST: 0.0.0.0
      API_CONTAINER_PORT: "8080"
      DEBUG: ${DEBUG:-0}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./src:/app/src
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
