[project]
name = "nevis-backend"
version = "0.1.0"
description = "MVP for the Basis home task"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "greenlet>=3,<4",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2,<3",
    "sqlmodel>=0.0.27,<0.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.32,<1",
]


[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "httpx2>=2.12.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["api*", "core*", "db*", "models*", "schemas*", "services*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "database: tests requiring a PostgreSQL database",
]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]
